name: Verify inductive fraud contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Verify leakage, training, ranking and serialization
        run: python -m unittest discover -s tests -v
      - name: Execute small independent smoke experiment
        run: python -m hybrid_fraud demo --out runs/ci --epochs 2 --per-day 12
      - name: Reconcile saved models and raw predictions
        run: python -m hybrid_fraud verify --out runs/ci
